<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jason Jaeseung Kim - Academic CV</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#2b2b2b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #viewer{width:100%;height:100%;border:0;display:none;background:#fff}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
    #status a{color:#fff;text-decoration:underline}
  </style>
</head>
<body>
  <div id="status">Loading CV...</div>
  <iframe id="viewer" title="Jason Jaeseung Kim Academic CV"></iframe>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      const viewer=document.getElementById('viewer');
      try{
        const b64=(await (await fetch('cv_base64.txt',{cache:'no-store'})).text()).trim();
        const binary=atob(b64);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
        viewer.src=url;
        viewer.style.display='block';
        status.remove();
      }catch(error){
        status.innerHTML='The CV could not be opened. <a href="mailto:xmflak20@gmail.com">Request it by email</a>.';
      }
    })();
  </script>
</body>
</html>
